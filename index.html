  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0e17;
      --bg-lighter: #131825;
      --text: #00ff41;
      --text-dim: #00aa2b;
      --text-dimmer: #007a1f;
      --blue: #00d9ff;
      --cyan: #8be9fd;
      --purple: #bd93f9;
      --pink: #ff79c6;
      --yellow: #f1fa8c;
      --red: #ff5555;
      --orange: #ffb86c;
      --green: #50fa7b;
      --green-dim: #3ad95f;
      --spotify: #1DB954;
      --instagram: #E1306C;
      --twitter: #1DA1F2;
    }

    /* Terminal Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0e17 0%, #0f1419 50%, #0a0e17 100%);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }

    #loading-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(90deg, transparent 0%, rgba(0, 255, 65, 0.03) 50%, transparent 100%);
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 500px;
    }

    .loading-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .loading-logo {
      font-size: 70px;
      animation: logoFloat 3s ease-in-out infinite;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 30px rgba(0, 255, 65, 0.6));
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }

    .loading-title {
      color: var(--cyan);
      font-size: 24px;
      font-weight: 700;
      font-family: 'SF Mono', monospace;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(139, 233, 253, 0.8);
      letter-spacing: 2px;
    }

    .loading-subtitle {
      color: var(--green);
      font-size: 14px;
      font-family: 'SF Mono', monospace;
      opacity: 0.8;
      letter-spacing: 1px;
    }

    #phrase-box {
      width: 100%;
      height: 200px;
      overflow: hidden;
      position: relative;
      margin: 30px 0;
      background: rgba(0, 255, 65, 0.02);
      border: 2px solid rgba(0, 255, 65, 0.3);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 
        0 0 30px rgba(0, 255, 65, 0.2),
        inset 0 0 30px rgba(0, 255, 65, 0.05);
    }

    #phrase-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to bottom, rgba(10, 14, 23, 0.9), transparent);
      pointer-events: none;
      z-index: 2;
    }

    #phrase-box::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(to top, rgba(10, 14, 23, 0.9), transparent);
      pointer-events: none;
      z-index: 2;
    }

    #phrases-container {
      position: relative;
      transition: transform 0.3s ease-out;
    }

    .loading-phrase {
      display: flex;
      align-items: center;
      height: 40px;
      margin-bottom: 10px;
      font-family: 'SF Mono', monospace;
      font-size: 15px;
      color: var(--green);
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .loading-phrase.active {
      opacity: 1;
      transform: scale(1.05);
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(139, 233, 253, 0.6);
    }

    .loading-phrase.completed {
      opacity: 0.5;
      color: var(--text-dim);
    }

    .phrase-check {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      flex-shrink: 0;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s ease;
    }

    .phrase-check.visible {
      opacity: 1;
      transform: scale(1);
    }

    .phrase-check svg {
      width: 100%;
      height: 100%;
    }

    .phrase-spinner {
      width: 16px;
      height: 16px;
      margin-right: 12px;
      border: 2px solid rgba(0, 255, 65, 0.3);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .phrase-spinner.visible {
      opacity: 1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-footer {
      text-align: center;
      margin-top: 30px;
    }

    .loading-progress {
      color: var(--cyan);
      font-family: 'SF Mono', monospace;
      font-size: 13px;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(139, 233, 253, 0.4);
    }

    .progress-dots {
      display: inline-block;
      width: 20px;
    }

    .loading-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(0, 255, 65, 0.1);
      border: 2px solid rgba(0, 255, 65, 0.3);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
    }

    .loading-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--cyan), var(--green));
      background-size: 200% 100%;
      width: 0%;
      animation: loadProgress 3s ease-in-out forwards, shimmer 1.5s linear infinite;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    body {
      font-family: 'SF Mono', 'Courier Prime', 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.5px;
      position: relative;
    }

    /* Social Bar */
    .social-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 23, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--green);
      padding: 10px 20px;
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 4px 30px rgba(0, 255, 65, 0.2);
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .social-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s;
    }

    .social-btn:hover::before {
      left: 100%;
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .social-btn:hover svg {
      transform: scale(1.15);
    }

    .social-btn.email {
      background: #f59e0b;
      color: #1a1a1a;
    }

    .social-btn.email:hover {
      filter: brightness(1.2);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.7);
    }

    .social-btn.instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
      color: white;
    }

    .social-btn.instagram:hover {
      filter: brightness(1.2);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(221, 42, 123, 0.7);
    }

    .social-btn.twitter {
      background: #000000;
      color: white;
    }

    .social-btn.twitter:hover {
      filter: brightness(1.2);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }

    .social-btn.spotify {
      background: #1DB954;
      color: white;
    }

    .social-btn.spotify:hover {
      filter: brightness(1.2);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.7);
    }

    .social-btn.github {
      background: #2a2a2a;
      color: white;
    }

    .social-btn.github:hover {
      filter: brightness(1.3);
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
    }

    /* Matrix Rain Canvas */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #matrix-canvas.active {
      opacity: 1;
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 255, 65, 0.015) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
      animation: scan 8s linear infinite;
      opacity: 0.6;
    }

    @keyframes scan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    .crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 14, 23, 0.5) 100%);
    }

    /* Matrix Mode Effects */
    body.matrix-mode {
      animation: glitch 0.3s infinite;
      background: #000000;
    }

    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }

    body.matrix-mode .line,
    body.matrix-mode #input {
      text-shadow: 
        0 0 5px #00ff00,
        0 0 10px #00ff00,
        0 0 15px #00ff00;
      animation: textFlicker 0.1s infinite;
    }

    @keyframes textFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.95; }
    }

    #terminal {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding: 90px 30px 30px 30px;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 15px;
      -webkit-overflow-scrolling: touch;
    }

    .line {
      margin: 8px 0;
      animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .prompt {
      color: var(--cyan);
      font-weight: 600;
      text-shadow: 0 0 8px rgba(139, 233, 253, 0.4);
    }

    body.matrix-mode .prompt {
      color: #00ff00;
      animation: matrixPulse 1s ease-in-out infinite;
    }

    @keyframes matrixPulse {
      0%, 100% {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00;
      }
      50% {
        color: #00cc00;
        text-shadow: 0 0 20px #00ff00;
      }
    }

    .cmd {
      color: var(--purple);
      text-shadow: 0 0 5px rgba(189, 147, 249, 0.3);
    }

    .output {
      margin: 15px 0 20px 0;
      padding-left: 10px;
    }

    .ascii {
      color: var(--text);
      font-size: 10px;
      line-height: 1.2;
      margin: 20px 0;
      white-space: pre;
      overflow-x: auto;
    }

    .input-line {
      display: flex;
      align-items: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    #input {
      flex-grow: 1;
      min-width: 200px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'SF Mono', 'Courier Prime', 'Courier New', monospace;
      font-size: 15px;
      caret-color: var(--green);
      margin-left: 8px;
      letter-spacing: 0.5px;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background: var(--green);
      animation: blink 1s infinite;
      margin-left: 2px;
      box-shadow: 0 0 8px rgba(80, 250, 123, 0.6);
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .title {
      color: var(--yellow);
      font-weight: 700;
      font-size: 16px;
      margin: 20px 0 15px 0;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(241, 250, 140, 0.4);
    }

    .info {
      margin: 12px 0;
      padding-left: 20px;
      position: relative;
      word-break: break-word;
      line-height: 1.8;
    }

    .info::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--green);
      text-shadow: 0 0 5px rgba(80, 250, 123, 0.5);
    }

    .key {
      color: var(--cyan);
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }

    .value {
      display: block;
      padding-left: 0;
    }

    .link {
      color: var(--cyan);
      text-decoration: none;
      border-bottom: 1px dashed var(--cyan);
      word-break: break-all;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-shadow: 0 0 5px rgba(139, 233, 253, 0.3);
    }

    .link:hover, .link:active {
      color: var(--green);
      border-bottom-color: var(--green);
      text-shadow: 0 0 8px rgba(80, 250, 123, 0.6);
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      margin: 6px 6px 6px 0;
      background: rgba(0, 255, 65, 0.12);
      border: 1px solid var(--green);
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 0 5px rgba(0, 255, 65, 0.2);
    }

    .tag:hover {
      background: rgba(0, 255, 65, 0.2);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.4);
      transform: translateY(-2px);
    }

    .error {
      color: var(--red);
      padding: 15px;
      border: 1px solid var(--red);
      border-radius: 6px;
      background: rgba(255, 85, 85, 0.1);
      margin: 15px 0;
      word-break: break-word;
      line-height: 1.8;
      box-shadow: 0 0 15px rgba(255, 85, 85, 0.2);
    }

    .success {
      color: var(--green);
      padding: 15px;
      border: 1px solid var(--green);
      border-radius: 6px;
      background: rgba(80, 250, 123, 0.1);
      margin: 15px 0;
      line-height: 1.8;
      box-shadow: 0 0 15px rgba(80, 250, 123, 0.2);
    }

    .cmd-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 20px;
      margin: 15px 0;
    }

    .cmd-name {
      color: var(--purple);
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 0 5px rgba(189, 147, 249, 0.3);
    }

    .cmd-desc {
      color: var(--text-dim);
      word-break: break-word;
    }

    .item {
      margin: 15px 0;
      padding-left: 25px;
      position: relative;
      line-height: 1.8;
      word-break: break-word;
    }

    .item::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--green);
      top: 0;
      text-shadow: 0 0 5px rgba(80, 250, 123, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      margin: 6px 0 6px 10px;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .badge-current {
      background: rgba(80, 250, 123, 0.2);
      color: var(--green);
      border: 1px solid var(--green);
      box-shadow: 0 0 10px rgba(80, 250, 123, 0.3);
    }

    .badge-progress {
      background: rgba(255, 184, 108, 0.2);
      color: var(--orange);
      border: 1px solid var(--orange);
      box-shadow: 0 0 10px rgba(255, 184, 108, 0.3);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(80, 250, 123, 0.3); }
      50% { box-shadow: 0 0 20px rgba(80, 250, 123, 0.6); }
    }

    .card {
      background: rgba(0, 255, 65, 0.04);
      border: 1px solid var(--green-dim);
      border-radius: 8px;
      padding: 20px;
      margin: 18px 0;
      line-height: 1.8;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.1);
    }

    .card:hover {
      background: rgba(0, 255, 65, 0.06);
      border-color: var(--green);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
      transform: translateY(-2px);
    }

    .card-title {
      color: var(--yellow);
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.6;
      word-break: break-word;
      text-shadow: 0 0 10px rgba(241, 250, 140, 0.3);
    }

    .card-meta {
      color: var(--cyan);
      font-size: 12px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .card-desc {
      color: var(--text);
      margin-bottom: 15px;
      line-height: 1.8;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--green);
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(80, 250, 123, 0.5);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--green-dim);
    }

    /* Mobile Styles */
    @media (max-width: 768px) {

      } else if (e.ctrlKey && e.key === 'l') {
        e.preventDefault();
        clearTerm();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addLine(html) {
      const line = document.createElement('div');
      line.className = 'line';
      line.innerHTML = html;
      const inputLine = term.querySelector('.input-line');
      if (inputLine) {
        term.insertBefore(line, inputLine);
      } else {
        term.appendChild(line);
      }
      term.scrollTop = term.scrollHeight;
    }

    function executeCmd(cmd) {
      const [main, ...args] = cmd.split(' ');
      
      const commands = {
        'help': showHelp,
        'whoami': showWhoami,
        'about': showAbout,
        'skills': showSkills,
        'experience': showExperience,
        'education': showEducation,
        'projects': showProjects,
        'dev': showDev,
        'achievements': showAchievements,
        'contact': showContact,
        'socials': showSocials,
        'clear': clearTerm,
        'ls': () => addLine('<div class="output">about.txt  skills.json  experience.log  projects/  contact.md</div>'),
        'pwd': () => addLine('<div class="output">/home/terminal/portfolio</div>'),
        'date': () => addLine(`<div class="output">${new Date().toString()}</div>`),
        'matrix': toggleMatrix,
        'sudo': () => addLine('<div class="error">🔒 Permission denied. Nice try! 😏</div>'),
        'exit': () => addLine('<div class="error">❌ Cannot exit. You\'re here forever! 😈</div>'),
        'hack': () => addLine('<div class="success">🎮 HACKING...<br>█████████ 100%<br>✓ Just kidding! 😄</div>')
      };

      if (commands[main]) {
        commands[main]();
      } else if (main) {
        addLine(`<div class="error">Command not found: ${escapeHtml(main)}<br>Type 'help' for available commands.</div>`);
      }
    }

    let matrix = false;
    function toggleMatrix() {
      matrix = !matrix;

      const matrixCanvas = document.getElementById('matrix-canvas');
      
      if (matrix) {
        body.classList.add('matrix-mode');
        matrixCanvas.classList.add('active');
        matrixInterval = setInterval(drawMatrix, 50);
        addLine('<div class="success">🟢 MATRIX MODE ACTIVATED<br>⚡ Digital rain enabled<br>✨ All systems enhanced<br>🎮 Welcome to the Matrix...</div>');
      } else {
        body.classList.remove('matrix-mode');
        matrixCanvas.classList.remove('active');
        clearInterval(matrixInterval);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        addLine('<div class="success">✓ Matrix mode deactivated<br>🔄 Returning to normal terminal...</div>');
      }
    }
